# Manda una petición a Supabase cada 3 días para que los proyectos gratuitos no se pausen por inactividad.
name: Mantener Supabase activo
on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: flete-tdl (valida un token falso: toca la base de datos)
        run: |
          curl -fsS -X POST "https://mqwjkshosxzkiqhrvasn.supabase.co/rest/v1/rpc/validar" \
            -H "apikey: sb_publishable_mM79u2QLOiIIDiDAaJEl-Q_xyPTov2z" \
            -H "Content-Type: application/json" \
            -d '{"p_token":"00000000-0000-0000-0000-000000000000"}'
      - name: bolsa-viajes
        run: |
          curl -fsS "https://rbhokfcdxqlhhujpidga.supabase.co/rest/v1/" \
            -H "apikey: sb_publishable_TvnGwCubHemRrEcebe49iw_j9PDArBP" -o /dev/null
